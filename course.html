<!DOCTYPE html>
<html lang="id">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Materi & Tugas - STUDYNE</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<div class="app-shell"><div id="sidebar"></div><div class="sidebar-backdrop" id="sidebarBackdrop"></div><main class="main-content">
<header class="topbar"><button type="button" class="menu-toggle" onclick="toggleSidebar()">☰</button><div class="topbar-title">Materi & Tugas</div><div class="topbar-user" id="topbarUser"></div></header>
<div class="page-content">
<a href="courses.html" class="back-link">← Kembali ke daftar mata kuliah</a>
<section id="courseDetail" class="course-detail"></section>
<section class="content-section material-section"><div class="section-heading"><div><span class="eyebrow">PEMBELAJARAN</span><h2>Materi & Tugas</h2></div><span id="courseCodeBadge" class="badge">-</span></div>
<div class="filter-tabs"><button class="filter-tab active" data-filter="all">Semua</button><button class="filter-tab" data-filter="materi">Materi</button><button class="filter-tab" data-filter="tugas">Tugas</button></div>
<div id="materialList" class="material-list"></div></section>
</div></main></div>
<div id="taskModal" class="modal-overlay" aria-hidden="true"><div class="task-modal" role="dialog" aria-modal="true" aria-labelledby="taskModalTitle"><button class="modal-close" type="button" onclick="closeTaskModal()" aria-label="Tutup">×</button><span class="eyebrow">PENGUMPULAN TUGAS</span><h2 id="taskModalTitle">Tugas</h2><p id="taskModalDescription" class="modal-description"></p><div class="task-meta-box"><div><span>Deadline</span><strong id="taskModalDeadline">-</strong></div><div><span>Status</span><strong id="taskModalStatus">Belum dikumpulkan</strong></div></div><div id="currentSubmission" class="submission-current"></div><form id="submissionForm" class="submission-form"><label class="upload-box" for="taskFile"><span class="upload-icon">📎</span><strong id="fileLabel">Pilih file jawaban</strong><small>PDF, DOC, DOCX, PPT, PPTX, XLS, XLSX, ZIP · maksimal 10 MB</small><input id="taskFile" type="file" accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.zip" required></label><div id="submissionMessage" class="form-message" role="alert"></div><div class="modal-actions"><button type="button" class="btn btn-secondary" onclick="closeTaskModal()">Batal</button><button type="submit" class="btn btn-primary" id="submitTaskButton">Kumpulkan Tugas</button></div></form></div></div>
<script src="js/data.js"></script><script src="js/script.js"></script>
<script>
document.addEventListener('DOMContentLoaded',function(){
 const user=requireAuth('mahasiswa'); if(!user)return; renderSidebar('courses'); document.getElementById('topbarUser').textContent=getInitials(user.nama||'Mahasiswa');
 const params=new URLSearchParams(location.search), id=params.get('id'), course=COURSES.find(c=>c.id===id), detail=document.getElementById('courseDetail'), list=document.getElementById('materialList');
 if(!course){detail.innerHTML='<div class="empty-state"><strong>Mata kuliah tidak ditemukan.</strong><p>Silakan kembali ke daftar mata kuliah.</p></div>';return;}
 document.title=course.code+' - '+course.name+' - STUDYNE'; document.getElementById('courseCodeBadge').textContent=course.code;
 detail.innerHTML='<div class="detail-banner"><div><span class="eyebrow">'+escapeHTML(course.code)+'</span><h1>'+escapeHTML(course.name)+'</h1><p>'+escapeHTML(course.description)+'</p></div><div class="detail-meta"><span>'+course.sks+' SKS</span><span>'+escapeHTML(course.schedule)+'</span><span>'+escapeHTML(course.lecturer)+'</span></div></div>'+'<div class="detail-progress"><div><span>Progress pembelajaran</span><strong>'+Number(course.progress||0)+'%</strong></div><div class="progress-bar"><div style="width:'+Math.min(100,Number(course.progress||0))+'%"></div></div></div>';
 const items=MATERIALS[id]||[]; let activeTask=null;
 function statusFor(item){const sub=getSubmission(item.id,user.id);if(sub)return 'Sudah dikumpulkan';return isPastDeadline(item)?'Deadline terlewat':'Belum dikumpulkan';}
 function render(filter){const shown=filter==='all'?items:items.filter(x=>x.type===filter);if(!shown.length){list.innerHTML='<div class="empty-state"><strong>Belum ada '+(filter==='tugas'?'tugas':'materi')+' yang tersedia.</strong><p>Konten akan muncul setelah dosen menambahkannya.</p></div>';return;}
 list.innerHTML=shown.map(item=>{const task=item.type==='tugas', status=task?statusFor(item):'';const button=task?'Buka Tugas':'Buka Materi';return '<article class="material-card '+(task?'task-card':'')+'"><div class="material-icon '+item.type+'">'+(task?'✓':'▤')+'</div><div class="material-main"><div class="material-title-row"><span class="content-type">'+(task?'TUGAS':'MATERI')+'</span><span class="material-date">'+escapeHTML(item.date||'')+'</span></div><h3>'+escapeHTML(item.title)+'</h3><p>'+escapeHTML(item.description)+'</p>'+(item.resource?'<small>📄 '+escapeHTML(item.resource)+'</small>':'')+(item.deadline?'<small>📅 Deadline: '+escapeHTML(item.deadline)+'</small>':'')+(task?'<small class="submission-status '+(status==='Sudah dikumpulkan'?'submitted':status==='Deadline terlewat'?'late':'pending')+'">● '+escapeHTML(status)+'</small>':'')+'</div><button class="btn '+(task?'btn-primary':'btn-secondary')+'" type="button" onclick="'+(task?'openTaskModal':'showContent')+'(\''+item.id+'\')">'+button+'</button></article>'}).join('');}
 window.showContent=function(itemId){const item=items.find(x=>x.id===itemId);if(!item)return;alert(item.title+'\n\n'+item.description+'\n\n'+(item.resource||'Materi tersedia di sistem.'));};
 window.openTaskModal=function(itemId){const item=items.find(x=>x.id===itemId);if(!item)return;activeTask=item;const sub=getSubmission(item.id,user.id);document.getElementById('taskModalTitle').textContent=item.title;document.getElementById('taskModalDescription').textContent=item.description;document.getElementById('taskModalDeadline').textContent=item.deadline||'Belum ditentukan';document.getElementById('taskModalStatus').textContent=statusFor(item);document.getElementById('submissionMessage').textContent='';document.getElementById('taskFile').value='';document.getElementById('fileLabel').textContent='Pilih file jawaban';
 const current=document.getElementById('currentSubmission');current.innerHTML=sub?'<div class="submission-card"><div><strong>File yang sudah dikumpulkan</strong><span>'+escapeHTML(sub.fileName)+' · '+formatFileSize(sub.fileSize)+'</span><small>Dikumpulkan '+escapeHTML(formatDateTime(sub.submittedAt))+'</small></div><a class="btn btn-secondary btn-small" href="'+sub.dataUrl+'" download="'+escapeHTML(sub.fileName)+'">Unduh</a></div>':'';
 const expired=isPastDeadline(item);document.getElementById('taskFile').disabled=expired;document.getElementById('submitTaskButton').disabled=expired;document.getElementById('submitTaskButton').textContent=expired?'Deadline Berakhir':sub?'Kirim Ulang Tugas':'Kumpulkan Tugas';if(expired&&!sub)document.getElementById('submissionMessage').textContent='Deadline tugas sudah berakhir sehingga pengumpulan tidak dapat dilakukan.';document.getElementById('taskModal').classList.add('show');document.getElementById('taskModal').setAttribute('aria-hidden','false');};
 window.closeTaskModal=function(){document.getElementById('taskModal').classList.remove('show');document.getElementById('taskModal').setAttribute('aria-hidden','true');activeTask=null;};
 document.getElementById('taskFile').addEventListener('change',function(){document.getElementById('fileLabel').textContent=this.files[0]?this.files[0].name:'Pilih file jawaban';});
 document.getElementById('submissionForm').addEventListener('submit',async function(e){e.preventDefault();if(!activeTask)return;const file=document.getElementById('taskFile').files[0];const msg=document.getElementById('submissionMessage');const btn=document.getElementById('submitTaskButton');msg.className='form-message';msg.textContent='';btn.disabled=true;try{const sub=await saveSubmission(activeTask,id,user,file);msg.className='form-message success';msg.textContent='Tugas berhasil dikumpulkan pada '+formatDateTime(sub.submittedAt)+'.';render(document.querySelector('.filter-tab.active').dataset.filter);setTimeout(()=>{if(activeTask){openTaskModal(activeTask.id);document.getElementById('submissionMessage').className='form-message success';document.getElementById('submissionMessage').textContent='Tugas berhasil dikumpulkan.';}},120);}catch(err){msg.className='form-message error';msg.textContent=err.message||'Tugas gagal dikumpulkan.';btn.disabled=false;}});
 document.querySelectorAll('.filter-tab').forEach(btn=>btn.addEventListener('click',function(){document.querySelectorAll('.filter-tab').forEach(x=>x.classList.remove('active'));this.classList.add('active');render(this.dataset.filter);}));document.getElementById('taskModal').addEventListener('click',e=>{if(e.target.id==='taskModal')closeTaskModal();});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeTaskModal();});render('all');
});
</script></body></html>
